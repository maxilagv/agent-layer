name: LayerAgent
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check -p layeragent-cli --features embeddings --locked
      - run: cargo build -p layeragent-cli --locked
      - if: runner.os != 'Windows'
        run: python3 tests/system_smoke.py
      - if: runner.os != 'Windows'
        run: python3 tests/auth_smoke.py
      - if: runner.os != 'Windows'
        run: python3 tests/secrets_smoke.py
      - if: runner.os != 'Windows'
        run: python3 tests/recovery_smoke.py
      - if: runner.os != 'Windows'
        run: python3 tests/tui_smoke.py
      - if: runner.os != 'Windows'
        run: python3 tests/backup_smoke.py
      - if: runner.os != 'Windows'
        run: python3 tests/release_hygiene.py
  linux-confinement:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: sudo apt-get update
      - run: sudo apt-get install -y bubblewrap
      - run: sudo sh deploy/apparmor/install.sh
      - run: python3 scripts/run_native_tests.py
  dependencies:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: python3 tests/dependency_policy.py
      - run: python3 scripts/check_dependencies.py
      - run: python3 tests/release_hygiene.py
      - run: python3 tests/source_signing.py
