[package]
name = "check-cmds"
version = "0.0.0"
edition = "2021"

[dependencies]
tauri = { path = "../tauri-stub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
thiserror = "2"

[workspace]
