[package]
name = "layeragent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
layeragent-protocol.workspace = true
layeragent-config.workspace = true
layeragent-storage.workspace = true
layeragent-sandbox.workspace = true
layeragent-browser.workspace = true
layeragent-ui.workspace = true
layeragent-providers.workspace = true
layeragent-skills.workspace = true
layeragent-rea.workspace = true
layeragent-core.workspace = true
layeragent-gateway.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
futures-util.workspace = true
uuid.workspace = true
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
clap_complete = "4"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
fs2 = "0.4"
tracing.workspace = true
async-trait.workspace = true
rmcp = { version = "3.5", features = ["server", "transport-io"] }

[[bin]]
name = "layeragent"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true

[features]
embeddings = ["layeragent-storage/embeddings"]

[lints]
workspace = true
