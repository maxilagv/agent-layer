# Outbound model policy. Explicit local-only mode also restricts fallback models.
[privacy]
local_models_only = false
allowed_providers = []

[policy.limits]
cpu_secs = 120
file_size_bytes = 268435456
open_files = 256
cgroup = false

[browser]
enabled = true
allow_domains = ["*"]
# Narrow this list before browsing sensitive projects.
