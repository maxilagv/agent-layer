schema_version = 1
primary = "local"
fallbacks = []
max_rounds = 32
max_input_tokens = 200000
max_output_tokens = 16384
auto_skills = true
# max_cost_usd = 0.50  # requires explicit prices for every eligible model
instructions = "Preserve existing changes and verify work with project checks."

[providers.local]
wire = "ollama"
base_url = "http://127.0.0.1:11434"

[models.local]
provider = "local"
id = "YOUR_INSTALLED_MODEL"
context_window = 32768
tools = true
input_per_million = 0.0
output_per_million = 0.0

[models.local.parameters.options]
temperature = 0.2

[providers.openai]
wire = "openai_responses"
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"

[models.openai]
provider = "openai"
id = "YOUR_OPENAI_MODEL"
context_window = 32768
tools = true

[providers.anthropic]
wire = "anthropic"
base_url = "https://api.anthropic.com/v1"
key_env = "ANTHROPIC_API_KEY"

[models.anthropic]
provider = "anthropic"
id = "YOUR_ANTHROPIC_MODEL"
context_window = 32768
tools = true

[providers.gemini]
wire = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta"
key_env = "GEMINI_API_KEY"

[models.gemini]
provider = "gemini"
id = "YOUR_GEMINI_MODEL"
context_window = 32768
tools = true

[policy]
shell = true
write = true
network = false
timeout_secs = 300
max_output_bytes = 1048576
approval_tools = ["shell"]
allowed_tools = []

[memory]
embeddings = false
model = "multilingual-e5-small"
idle_seconds = 120

[gateway]
bind = "127.0.0.1:9473"
token_env = "LAYERAGENT_TOKEN"

